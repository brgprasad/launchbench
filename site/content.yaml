home_faq:
  - q: Can I visit before I sign up?
    a: Yes. Tours run Monday to Saturday, 10 am to 6 pm, and take about 30 minutes. Book one online and we'll confirm a slot by email.
  - q: Are your prices inclusive of GST?
    a: No. Every price on this site is per month and excludes 18% GST. Longer lock-ins earn 5% (6 months) or 10% (12 months) off seat fees.
  - q: How are private cabins billed?
    a: On the cabin's full capacity, not on headcount. Cabins come in fixed sizes, so a team of 14 takes a 16-seat cabin.
  - q: Do you have a plan for very early teams?
    a: The Founders Plan gives teams of 1 to 3 dedicated desks on a 3-month lock-in at Koramangala, Indiranagar and HSR Layout. Companies incorporated less than 3 years ago, or DPIIT-recognised, are eligible.
